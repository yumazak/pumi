# Checks that run before each commit, via `prek` (installed by mise).
#
# The toolchain is pinned in mise.toml; `knip` is a devDependency of
# crates/pumi/web/, so `pnpm --dir crates/pumi/web` resolves it from the
# lockfile.
#
# Whole-project checks set `pass_filenames = false` and are scoped with
# `files`, so a Rust-only commit does not pay for the web checks and a web-only
# commit does not pay for cargo.

[[repos]]
repo = "local"

[[repos.hooks]]
id = "knip"
name = "knip (unused files, exports, deps)"
entry = "pnpm --dir crates/pumi/web run knip"
language = "system"
files = "^crates/pumi/web/"
pass_filenames = false

[[repos.hooks]]
id = "oxlint"
name = "oxlint"
entry = "pnpm --dir crates/pumi/web run lint"
language = "system"
files = "^crates/pumi/web/"
pass_filenames = false

[[repos.hooks]]
id = "typecheck"
name = "tsc --build"
entry = "pnpm --dir crates/pumi/web run typecheck"
language = "system"
files = "^crates/pumi/web/"
pass_filenames = false

[[repos.hooks]]
id = "routes"
name = "routeTree.gen.ts is current"
entry = "bash crates/pumi/web/scripts/check-routes.sh"
language = "system"
files = "^crates/pumi/web/src/routes/|^crates/pumi/web/src/routeTree\\.gen\\.ts$"
pass_filenames = false

[[repos.hooks]]
id = "no-tracked-generated"
name = "generated trees are not tracked (node_modules / dist)"
entry = "sh -c \"! git ls-files | grep -Eq '(^|/)(node_modules|dist)/'\""
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "cargo fmt --all -- --check"
language = "system"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
entry = "cargo clippy --workspace --all-targets -- -D warnings"
language = "system"
types = ["rust"]
pass_filenames = false
